[package]
name = "rust"
version = "0.1.0"
authors = ["lemonlime4 <71093251+User2573@users.noreply.github.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.129"
# web-sys = { version = "0.3.104", features = ["Blob"] }
wuff = "0.2.9"
harfrust = "0.14.0"
skrifa = "0.48.0"
glam = "0.34.1"
serde = "1.0.229"
serde-wasm-bindgen = "0.6.5"
tsify = "0.5.8"
anyhow = "1.0.104"

# TODO make this disappear in release
console_error_panic_hook = { version = "0.1.7", optional = true }

[profile.release]
opt-level = "s"
lto = true
